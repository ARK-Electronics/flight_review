name: Production health
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions: {}
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check service and recovery status
        run: |
          for path in healthz readyz opsz; do
            curl --fail --silent --show-error --max-time 20 --retry 2 --retry-delay 5 "https://review.arkelectron.com/$path"
          done
