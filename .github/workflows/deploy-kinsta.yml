name: Deploy to Kinsta

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: kinsta-deploy
  cancel-in-progress: false

jobs:
  trigger-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Kinsta deploy hook
        env:
          DEPLOY_HOOK_URL: ${{ secrets.KINSTA_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "KINSTA_DEPLOY_HOOK_URL secret is not set" >&2
            exit 1
          fi
          curl --fail --show-error --silent \
               --retry 3 --retry-delay 5 \
               --max-time 30 \
               -X POST "$DEPLOY_HOOK_URL"
