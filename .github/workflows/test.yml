name: Validate and deploy
on:
  push:
    branches: [main, 'fix/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    name: Regression and security checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: app/requirements.txt
      - run: pip install --require-hashes -r app/requirements.txt
      - run: pip install pylint==4.0.8 pytest==9.1.1 pip-audit==2.10.1
      - run: python -m pytest app/tests -q
        env:
          PYTHONPATH: app:app/plot_app:app/plot_app/libevents/libs/python
          OPENBLAS_NUM_THREADS: '1'
      - run: bash run_pylint.sh
      - run: pip-audit -r app/requirements.txt --no-deps --disable-pip
  image:
    name: Production image smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false
      - run: docker build --build-arg APP_REVISION="$GITHUB_SHA" -t flight-review:test .
      - run: bash scripts/smoke_image.sh
      - name: Scan fixed high and critical image vulnerabilities
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.69.3 image --exit-code 1 --ignore-unfixed --severity HIGH,CRITICAL flight-review:test
  deploy:
    name: Deploy tested revision
    needs: [tests, image]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    concurrency:
      group: sevalla-production
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python scripts/deploy_sevalla.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SEVALLA_API_KEY: ${{ secrets.SEVALLA_API_KEY }}

